name: PRIME 4 LED evidence tests
on:
  push:
    branches: [feature/button-led-behavior, test/all-features]
    paths: ['tools/ui-mod/*button_led*', 'docs/prime4-steady-button-leds.md', '.github/workflows/button-led-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/ui-mod -p 'test_button_led_review.py'
