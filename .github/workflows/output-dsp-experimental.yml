name: Experimental output DSP tests
on:
  push:
    branches: [test/all-features, feature/dsp-core, feature/output-eq, feature/subharmonic-synth]
    paths: ['tools/ui-mod/**', 'tools/mods/**', 'docs/mods/src/**', 'pkg/webui/**', 'pkg/mods/**', 'tests/test_boot_safety.sh', 'tests/test_rootfs_overlay.sh', '.github/workflows/output-dsp-experimental.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: output-dsp-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Signal, config lifecycle and sanitizers (all feature combinations)
        run: |
          set -euo pipefail
          for flags in '-DOD_FEATURE_EQ=0 -DOD_FEATURE_SUB=0' '-DOD_FEATURE_EQ=1 -DOD_FEATURE_SUB=0' '-DOD_FEATURE_EQ=0 -DOD_FEATURE_SUB=1' '-DOD_FEATURE_EQ=1 -DOD_FEATURE_SUB=1'; do
            gcc -std=c11 -O2 -Wall -Wextra -Werror $flags tools/ui-mod/test_output_dsp_lifecycle.c -lm -o /tmp/od-life
            /tmp/od-life
          done
          for source in test_output_dsp test_output_dsp_lifecycle test_output_dsp_threads test_output_dsp_rates test_output_dsp_continuity; do
            gcc -std=c11 -O2 -Wall -Wextra -Werror -DOD_FEATURE_EQ=1 -DOD_FEATURE_SUB=1 tools/ui-mod/$source.c -pthread -lm -o /tmp/od-test
            /tmp/od-test
            gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -DOD_FEATURE_EQ=1 -DOD_FEATURE_SUB=1 tools/ui-mod/$source.c -pthread -lm -o /tmp/od-san
            /tmp/od-san
          done
      - name: Reproducible Mod archives and transactional UI generation
        run: python3 -m unittest discover -s tools/mods -p 'test_output_dsp*.py'
      - name: Install Qt 5 tools on the disposable build runner
        run: |
          set -euo pipefail
          apt_args=(-o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            apt_args+=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${apt_args[@]}" update
          sudo apt-get "${apt_args[@]}" install -y --no-install-recommends qmlscene qml-module-qtquick2 qml-module-qtquick-window2 qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qttest qtdeclarative5-dev-tools
      - name: Qt 5 optional-panel instantiation
        run: python3 tools/ui-mod/test_output_dsp_qml.py
      - name: Existing boot fallback and overlay regression tests (mocked host commands)
        run: |
          bash tests/test_boot_safety.sh
          bash tests/test_rootfs_overlay.sh
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native ARM64 audio callback guard and budget
        run: |
          set -euo pipefail
          W=-Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free,--wrap=pthread_mutex_lock
          W=$W,--wrap=pthread_cond_wait,--wrap=read,--wrap=write,--wrap=close,--wrap=usleep
          W=$W,--wrap=nanosleep,--wrap=poll,--wrap=fwrite,--wrap=fputs,--wrap=puts,--wrap=fprintf
          W=$W,--wrap=vfprintf,--wrap=printf,--wrap=fopen,--wrap=readlink,--wrap=dlsym
          gcc -std=gnu11 -O2 -U_FORTIFY_SOURCE tools/ui-mod/test_rt_callback.c $W -ldl -lpthread -lm -o /tmp/rt-callback
          /tmp/rt-callback
          /tmp/rt-callback selftest
          gcc -std=c11 -O2 -pthread tools/ui-mod/test_rt_budget.c -lm -o /tmp/rt-budget
          /tmp/rt-budget
      - name: Native ARM64 hook link and ABI dependencies
        run: CROSS= OUT=/tmp/output-dsp-hook-arm64.so sh tools/ui-mod/build.sh
  armhf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ARMv7 cross tools on the disposable build runner
        run: |
          set -euo pipefail
          apt_args=(-o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            apt_args+=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${apt_args[@]}" update
          sudo apt-get "${apt_args[@]}" install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross binutils-arm-linux-gnueabihf qemu-user
      - name: ARMv7 hook and real callback compile
        run: |
          OUT=/tmp/output-dsp-hook-armv7.so sh tools/ui-mod/build.sh
          W=-Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free,--wrap=pthread_mutex_lock
          W=$W,--wrap=pthread_cond_wait,--wrap=read,--wrap=write,--wrap=close,--wrap=usleep
          W=$W,--wrap=nanosleep,--wrap=poll,--wrap=fwrite,--wrap=fputs,--wrap=puts,--wrap=fprintf
          W=$W,--wrap=vfprintf,--wrap=printf,--wrap=fopen,--wrap=readlink,--wrap=dlsym
          arm-linux-gnueabihf-gcc -mthumb -march=armv7-a -mfpu=neon -mfloat-abi=hard -std=gnu11 -O2 -U_FORTIFY_SOURCE tools/ui-mod/test_rt_callback.c $W -ldl -lpthread -lm -o /tmp/rt-armv7
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/rt-armv7 selftest
      - name: ARMv7 functional tests (emulation is not a real-time certificate)
        run: |
          for source in test_output_dsp test_output_dsp_lifecycle test_output_dsp_threads test_output_dsp_rates test_output_dsp_continuity; do
            arm-linux-gnueabihf-gcc -mthumb -march=armv7-a -mfpu=neon -mfloat-abi=hard -std=c11 -O2 -DOD_FEATURE_EQ=1 -DOD_FEATURE_SUB=1 tools/ui-mod/$source.c -pthread -lm -o /tmp/od-armv7
            qemu-arm -L /usr/arm-linux-gnueabihf /tmp/od-armv7
          done
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format, vet, backend and loader race tests
        run: |
          test -z "$(gofmt -l pkg/webui/output_dsp*.go)"
          go vet ./pkg/webui ./pkg/mods
          go test -race ./pkg/webui ./pkg/mods
  threads:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Concurrent control publication under ThreadSanitizer
        run: |
          gcc -std=c11 -O1 -g -fsanitize=thread -fno-pie -no-pie -DOD_FEATURE_EQ=1 -DOD_FEATURE_SUB=1 tools/ui-mod/test_output_dsp_threads.c -pthread -lm -o /tmp/od-tsan
          /tmp/od-tsan
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting and record exact formatted source
        run: |
          gofmt -w pkg/webui/output_dsp*.go
          python3 -c 'import json,pathlib; [print("OD_FORMATTED="+json.dumps({str(p):p.read_text()})) for p in pathlib.Path("pkg/webui").glob("output_dsp*.go")]'
          git diff --exit-code --stat -- pkg/webui/output_dsp*.go
