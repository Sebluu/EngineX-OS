name: PRIME 4 official firmware inspection
on:
  push:
    branches: [test/all-features]
    paths: ['.github/workflows/prime4-offline-fixture.yml', 'tools/ui-mod/probe_prime4_fixture.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download and verify the pinned official PRIME 4 5.3.0 image
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 'https://public.inmusiccdn.com/Engine/5.3.0/RELEASE/d41cd81e67f225bf/PRIME4-5.3.0-Update.img' -o "$RUNNER_TEMP/official-prime4.img"
          echo "8e49313be0ef338d5452631c5772ee5b1d72e076cae65bf69a6df8b5b210029f  $RUNNER_TEMP/official-prime4.img" | sha256sum -c -
      - name: Install extraction tools on the disposable runner
        timeout-minutes: 10
        run: |
          apt_args=(-o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            apt_args+=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          # Pin the Ubuntu archive endpoint instead of the runner's throttled EC2 mirror.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${apt_args[@]}" update
          sudo apt-get "${apt_args[@]}" install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user e2fsprogs zstd python3-pil qmlscene qml-module-qtquick2 qml-module-qtquick-window2
      - name: Extract files and QRC with unprivileged QEMU, never a device
        run: |
          set -euo pipefail
          python3 -I tools/az01-packer/az01_packer.py unpack "$RUNNER_TEMP/official-prime4.img" --output "$RUNNER_TEMP/prime4-parts"
          mkdir "$RUNNER_TEMP/prime4-root"
          debugfs -R "rdump / $RUNNER_TEMP/prime4-root" "$RUNNER_TEMP/prime4-parts/rootfs.ext2" 2>"$RUNNER_TEMP/debugfs.log"
          arm-linux-gnueabihf-gcc -O2 -shared -fPIC tools/ui-mod/qrc_dump.c -ldl -o "$RUNNER_TEMP/qrc-dump.so"
          python3 -I tools/ui-mod/extract_qrc.py --tree "$RUNNER_TEMP/prime4-root" --preload "$RUNNER_TEMP/qrc-dump.so" --out "$RUNNER_TEMP/prime4-qrc"
      - name: Record bounded assignment evidence and build matching UI packs
        run: |
          python3 tools/ui-mod/probe_prime4_fixture.py "$RUNNER_TEMP/prime4-root" "$RUNNER_TEMP/prime4-qrc"
          python3 - "$RUNNER_TEMP/prime4-root" "$RUNNER_TEMP/prime4-qrc" <<'PY'
          from pathlib import Path
          import hashlib,json,re,sys
          for p in Path(sys.argv[1]).rglob("*Controller_Assignments.qml"):
              rows=p.read_text(errors="replace").splitlines()
              value=next((s.strip() for s in rows[:30] if "objectName:" in s),"")
              print("CONTROLLER_SCOPE="+json.dumps({"path":p.relative_to(Path(sys.argv[1])).as_posix(),"objectName":value}))
          names={"playcue.qml","djfxactivate.qml","sweepfxselect.qml","deckassignmentconfig.qml","globalassignmentconfig.qml"}
          pattern=re.compile(r"(?i)(play|pause|flash|blink|product|board|objectName|deviceName|globalConfig|led)")
          for root in map(Path,sys.argv[1:]):
              for p in root.rglob("*.qml"):
                  if p.name.lower() not in names and p.name!="JC11_Controller_Assignments.qml":
                      continue
                  if p.is_symlink() or p.stat().st_size>512*1024:
                      continue
                  raw=p.read_bytes();lines=raw.decode("utf-8",errors="replace").splitlines()
                  keep=set(range(min(30,len(lines))))
                  for i in [i for i,s in enumerate(lines) if pattern.search(s)][:40]:
                      keep.update(range(max(0,i-2),min(len(lines),i+5)))
                  print("LED_MODULE="+json.dumps({"path":p.relative_to(root).as_posix(),"sha256":hashlib.sha256(raw).hexdigest(),"lines":[[i+1,lines[i]] for i in sorted(keep)]}))
          PY
          python3 -m unittest discover -s tools/mods -p 'test_prime4_led_mod.py'
          python3 tools/mods/test_prime4_led_fixture.py "$RUNNER_TEMP/prime4-root" "$RUNNER_TEMP/prime4-qrc" "$RUNNER_TEMP/prime4-leds-preview.tar.gz"
          go run tools/mods/check_prime4_led_loader.go "$RUNNER_TEMP/prime4-leds-preview.tar.gz"
          python3 tools/ui-mod/build_packs.py --qrc "$RUNNER_TEMP/prime4-qrc" --out "$RUNNER_TEMP/prime4-ui-packs"
