name: PRIME 4 desktop preview
on:
  push:
    branches: [feature/desktop-preview]
    paths: ['.github/workflows/prime4-desktop-preview.yml', 'tools/preview/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Obtain pinned baseline in disposable storage
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/desktop-preview"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/Cd1s/EngineX-OS/releases/download/v5.3.0.5-r1/PRIME4-5.3.0.5-EngineX-OS-Denon-PRIME-4-JC11-Update.img' -o "$RUNNER_TEMP/desktop-preview/baseline.img"
          echo "a76b3eaefdb24dab01ec70f2316c0809a6b25d281fa6c03d751437463a1f25e6  $RUNNER_TEMP/desktop-preview/baseline.img" | sha256sum -c -
          curl --fail --location --retry 2 --max-time 180 'https://public.inmusiccdn.com/Engine/5.3.0/RELEASE/d41cd81e67f225bf/PRIME4-5.3.0-Update.img' -o "$RUNNER_TEMP/desktop-preview/stock.img"
          echo "8e49313be0ef338d5452631c5772ee5b1d72e076cae65bf69a6df8b5b210029f  $RUNNER_TEMP/desktop-preview/stock.img" | sha256sum -c -
      - name: Install cross compiler and fetch Qt 6 public headers
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo dpkg --add-architecture armhf
          printf '%s\n' 'Types: deb' 'URIs: https://ports.ubuntu.com/ubuntu-ports' 'Suites: noble noble-updates noble-security' 'Components: main universe' 'Architectures: armhf' 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' | sudo tee /etc/apt/sources.list.d/preview-armhf.sources > /dev/null
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabihf libc6-dev-armhf-cross qt6-base-dev-tools qemu-user qemu-user-static binfmt-support e2fsprogs zstd python3-pil iproute2
          mkdir "$RUNNER_TEMP/desktop-preview/qt-sdk"
          cd "$RUNNER_TEMP/desktop-preview/qt-sdk"
          apt-get download qt6-base-dev:armhf qt6-declarative-dev:armhf libqt6test6t64:armhf
          for archive in *.deb; do dpkg-deb -x "$archive" .; done
          sudo update-binfmts --enable qemu-arm
          grep -q '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-arm
      - name: Compile preview-only public Qt bridge
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/desktop-preview/qt-sdk/usr/include/arm-linux-gnueabihf/qt6"
          /usr/lib/qt6/libexec/moc -I"$sdk" -I"$sdk/QtCore" -I"$sdk/QtGui" tools/preview/bridge.cpp -o "$RUNNER_TEMP/desktop-preview/bridge.moc"
          arm-linux-gnueabihf-g++ -I"$RUNNER_TEMP/desktop-preview" -std=c++17 -O2 -Wall -Wextra -Werror -shared -fPIC -pthread -I"$sdk" -I"$sdk/QtCore" -I"$sdk/QtGui" -I"$sdk/QtQuick" -I"$sdk/QtQml" -o "$RUNNER_TEMP/desktop-preview/bridge.so" tools/preview/bridge.cpp -L"$RUNNER_TEMP/desktop-preview/qt-sdk/usr/lib/arm-linux-gnueabihf" -l:libQt6Test.so.6
          bash -n tools/preview/*.sh
          python3 -m unittest discover -s tools/preview -p test_preview.py -v
          gofmt -w tools/preview/backend.go
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/desktop-preview/backend" tools/preview/backend.go
      - name: Extract and run actual ARM Engine with synthetic input target
        timeout-minutes: 8
        run: |
          set -euo pipefail
          task_work="$RUNNER_TEMP/desktop-preview"
          python3 -I tools/az01-packer/az01_packer.py unpack "$task_work/baseline.img" --output "$task_work/parts"
          mkdir "$task_work/root"
          debugfs -R "rdump / $task_work/root" "$task_work/parts/rootfs.ext2" 2>"$task_work/debugfs.log"
          python3 -I tools/az01-packer/az01_packer.py unpack "$task_work/stock.img" --output "$task_work/stock-parts"
          mkdir "$task_work/stock-root"
          debugfs -R "rdump / $task_work/stock-root" "$task_work/stock-parts/rootfs.ext2" 2>"$task_work/stock-debugfs.log"
          mkdir -p "$task_work/runtime"
          GITHUB_ACTIONS=true bash tools/preview/build.sh "$task_work"
          sudo env "PATH=$PATH" "GITHUB_ACTIONS=true" bash tools/preview/sandbox.sh "$task_work" smoke
          sudo env "PATH=$PATH" "GITHUB_ACTIONS=true" bash tools/preview/sandbox.sh "$task_work" smoke
      - name: Bounded diagnostic evidence
        if: always()
        run: |
          task_work="$RUNNER_TEMP/desktop-preview"
          if test -f "$task_work/engine.log"; then grep -aE 'PREVIEW_|QmlWarnings|ReferenceError|TypeError|Expected token|is not a type|symbol lookup|error while|Cannot load|Could not|ASSERT|Segmentation|Aborted' "$task_work/engine.log" | tail -30 || true; fi
          if test -f "$task_work/backend.log"; then tail -15 "$task_work/backend.log"; fi
          if test -f "$task_work/runtime/frame.json"; then cat "$task_work/runtime/frame.json"; fi
          # No firmware, vendor files, runtime credentials or compiled binary is uploaded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-frame
          path: ${{ runner.temp }}/desktop-preview/runtime/frame.png
          if-no-files-found: ignore
          retention-days: 1

  local-vm:
    needs: native-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install local VM launcher dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Start the complete local browser VM and test its lifecycle
        timeout-minutes: 24
        run: python3 tools/preview/test_vm.py "$RUNNER_TEMP/browser-vm"
      - name: Bounded VM setup diagnostics
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/browser-vm/launcher-test.log" || tail -30 "$RUNNER_TEMP/browser-vm/launcher-test.log"
          test ! -f "$RUNNER_TEMP/browser-vm/console.log" || tail -80 "$RUNNER_TEMP/browser-vm/console.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-vm-frame
          path: ${{ runner.temp }}/browser-vm/browser-frame.png
          if-no-files-found: ignore
          retention-days: 1
