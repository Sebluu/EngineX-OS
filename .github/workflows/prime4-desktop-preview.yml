name: PRIME 4 desktop preview inspection
on:
  push:
    branches: [feature/desktop-preview]
    paths: ['.github/workflows/prime4-desktop-preview.yml', 'tools/preview/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned official image into disposable storage
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 'https://public.inmusiccdn.com/Engine/5.3.0/RELEASE/d41cd81e67f225bf/PRIME4-5.3.0-Update.img' -o "$RUNNER_TEMP/prime4.img"
          echo "8e49313be0ef338d5452631c5772ee5b1d72e076cae65bf69a6df8b5b210029f  $RUNNER_TEMP/prime4.img" | sha256sum -c -
      - name: Inspect bundled display plugins
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
          sudo apt-get install -y --no-install-recommends e2fsprogs zstd
          python3 -I tools/az01-packer/az01_packer.py unpack "$RUNNER_TEMP/prime4.img" --output "$RUNNER_TEMP/prime4-parts"
          mkdir "$RUNNER_TEMP/prime4-root"
          debugfs -R "rdump / $RUNNER_TEMP/prime4-root" "$RUNNER_TEMP/prime4-parts/rootfs.ext2" 2>"$RUNNER_TEMP/debugfs.log"
          python3 - "$RUNNER_TEMP/prime4-root" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for folder in ("platforms","platforminputcontexts","xcbglintegrations"):
              for p in sorted(root.rglob(folder)):
                  if p.is_dir():
                      print("QT_PLUGIN_DIRECTORY",p.relative_to(root))
                      for entry in sorted(p.iterdir()):
                          print("QT_PLUGIN",entry.relative_to(root))
          for p in sorted(root.rglob("libQt5Core.so*")):
              print("QT_CORE",p.relative_to(root))
          PY
